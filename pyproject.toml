[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "figma-to-fgui-core"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "aggdraw>=1.3,<2",
  "fastapi>=0.115,<0.120",
  "httpx>=0.27,<1",
  "lxml>=5.2,<6",
  "numpy>=2,<3",
  "pillow>=11,<13",
  "psd-tools[composite]>=1.19,<2",
  "pydantic>=2.8,<3",
  "python-multipart>=0.0.20,<1",
  "py7zr>=1,<2",
  "pyyaml>=6.0,<7",
  "rarfile>=4.2,<5",
  "scikit-image>=0.25,<0.27",
  "typer>=0.12,<0.13",
]

[project.optional-dependencies]
dev = ["mypy>=1.11,<2", "pytest>=8.3,<9", "ruff>=0.6,<1"]
server = ["uvicorn>=0.30,<1"]

[project.scripts]
fgui-tool = "figma_to_fgui.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/figma_to_fgui"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"
pythonpath = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.mypy]
# The runtime and venv are Python 3.12; numpy's bundled stubs use PEP 695
# type statements that abort parsing at 3.11, which kept the strict gate
# from running at all. Checking at 3.12 restores the gate; 3.11-only
# regressions would surface at runtime and in CI smoke tests.
python_version = "3.12"
strict = true

[[tool.mypy.overrides]]
module = ["lxml.*", "rarfile", "yaml", "aggdraw"]
ignore_missing_imports = true
