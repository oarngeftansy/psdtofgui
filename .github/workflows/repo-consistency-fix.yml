name: Repository one-shot consistency fixes

on:
  push:
    branches:
      - fix/policy27-semantic-reskin

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/policy27-semantic-reskin
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply deterministic repository fixes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          # Pin Typer to the behavior family the CLI contract/tests were written
          # against. The previous <1 range silently admitted breaking formatter
          # changes all the way through 0.27.
          path = Path('pyproject.toml')
          text = path.read_text('utf-8')
          text = text.replace('"typer>=0.12,<1",', '"typer>=0.12,<0.13",', 1)
          path.write_text(text, 'utf-8')

          # Classify structurally absurd/deep transport JSON as RESPONSE_JSON
          # before schema extraction. CPython versions differ on when json.loads
          # itself raises RecursionError.
          path = Path('src/figma_to_fgui/ai_client.py')
          text = path.read_text('utf-8')
          marker = '''def _extract_content(payload: object) -> str:\n'''
          helper = '''def _json_nesting_exceeds_limit(data: bytes, limit: int = 256) -> bool:\n    """Bound JSON container nesting without decoding private response content."""\n    depth = 0\n    in_string = False\n    escaped = False\n    for byte in data:\n        if in_string:\n            if escaped:\n                escaped = False\n            elif byte == 0x5C:  # backslash\n                escaped = True\n            elif byte == 0x22:  # quote\n                in_string = False\n            continue\n        if byte == 0x22:\n            in_string = True\n        elif byte in (0x5B, 0x7B):  # [ {\n            depth += 1\n            if depth > limit:\n                return True\n        elif byte in (0x5D, 0x7D):  # ] }\n            depth = max(0, depth - 1)\n    return False\n\n\n'''
          if helper not in text:
              text = text.replace(marker, helper + marker, 1)
          old = '''        body = self._request(payload)\n        try:\n            response_payload = json.loads(body)\n'''
          new = '''        body = self._request(payload)\n        if _json_nesting_exceeds_limit(body):\n            raise AIAnalysisError(AIReasonCode.RESPONSE_JSON)\n        try:\n            response_payload = json.loads(body)\n'''
          if old not in text:
              raise SystemExit('AI parse marker missing')
          text = text.replace(old, new, 1)
          path.write_text(text, 'utf-8')

          # These tests attempted to mutate canonical compact fixtures using
          # pretty-printed search strings, so replacement was a no-op.
          path = Path('tests/unit/test_cli.py')
          text = path.read_text('utf-8')
          text = text.replace(
              '''replace('"namingPolicyVersion": 1', '"namingPolicyVersion": 1, "namingPolicyVersion": 1')''',
              '''replace('"namingPolicyVersion":1', '"namingPolicyVersion":1,"namingPolicyVersion":1')''',
          )
          text = text.replace(
              '''replace('"namingPolicyVersion": 1', '"namingPolicyVersion": true')''',
              '''replace('"namingPolicyVersion":1', '"namingPolicyVersion":true')''',
          )
          text = text.replace(
              '''replace('"schemaVersion": 2', '"schemaVersion": 2, "schemaVersion": 2')''',
              '''replace('"schemaVersion":2', '"schemaVersion":2,"schemaVersion":2')''',
          )
          text = text.replace(
              '''replace('"schemaVersion": 2', '"schemaVersion": "2"')''',
              '''replace('"schemaVersion":2', '"schemaVersion":"2"')''',
          )
          path.write_text(text, 'utf-8')

          # Keep source-inspection tests cross-platform; run executable
          # PowerShell integration cases only on Windows.
          path = Path('tests/unit/test_windows_lan_package.py')
          text = path.read_text('utf-8')
          if 'import pytest\n' not in text:
              text = text.replace('from pathlib import Path\n', 'from pathlib import Path\n\nimport pytest\n', 1)
          text = text.replace(
              'def test_client_sync_repairs_a_corrupted_installed_release(tmp_path: Path) -> None:',
              '@pytest.mark.skipif(os.name != "nt", reason="requires Windows PowerShell runtime")\ndef test_client_sync_repairs_a_corrupted_installed_release(tmp_path: Path) -> None:',
              1,
          )
          text = text.replace(
              'def test_background_updater_can_complete_a_real_sync_once(tmp_path: Path) -> None:',
              '@pytest.mark.skipif(os.name != "nt", reason="requires Windows PowerShell runtime")\ndef test_background_updater_can_complete_a_real_sync_once(tmp_path: Path) -> None:',
              1,
          )
          path.write_text(text, 'utf-8')

          # Align the output-invalid assertion with the builder's single public
          # diagnostic naming scheme: every failed gate ends in _failed.
          path = Path('tests/unit/test_fgui_new_project_build.py')
          text = path.read_text('utf-8').replace(
              '"fgui.writer.build.output_invalid"',
              '"fgui.writer.build.output_invalid_failed"',
              1,
          )
          path.write_text(text, 'utf-8')
          PY
          python -m pip install 'ruff==0.16.10'
          python -m ruff check --fix \
            src/figma_to_fgui/ai_client.py \
            tests/unit/test_cli.py \
            tests/unit/test_windows_lan_package.py \
            tests/unit/test_fgui_new_project_build.py
          rm .github/workflows/repo-consistency-fix.yml
      - name: Commit fixes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Fix repository version and platform consistency gaps'
          git push origin HEAD:fix/policy27-semantic-reskin
