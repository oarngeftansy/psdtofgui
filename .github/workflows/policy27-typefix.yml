name: Policy 27 one-shot type gate normalization

on:
  push:
    branches:
      - fix/policy27-semantic-reskin

permissions:
  contents: write

jobs:
  normalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/policy27-semantic-reskin
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Normalize type gates
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          for name, function in (
              ('src/figma_to_fgui/hifi_semantic_pairing.py', 'def _parents'),
              ('src/figma_to_fgui/hifi_semantic_reskin.py', 'def _parent_ids'),
          ):
              path = Path(name)
              text = path.read_text('utf-8')
              old = '    pending = [(root, None) for root in manifest.top_level_nodes]\n'
              new = ('    pending: list[tuple[SelectionNode, str | None]] = [\n'
                     '        (root, None) for root in manifest.top_level_nodes\n'
                     '    ]\n')
              start = text.find(function)
              if start < 0:
                  raise SystemExit(f'{function} missing in {name}')
              tail = text[start:]
              if old not in tail:
                  raise SystemExit(f'pending marker missing in {function}')
              tail = tail.replace(old, new, 1)
              path.write_text(text[:start] + tail, 'utf-8')

          workflow = Path('.github/workflows/policy27-ci.yml')
          workflow.write_text('''name: Policy 27 CI\n\non:\n  push:\n    branches:\n      - main\n      - fix/policy27-semantic-reskin\n  pull_request:\n\npermissions:\n  contents: read\n\njobs:\n  python-quality:\n    runs-on: ubuntu-latest\n    timeout-minutes: 25\n    steps:\n      - uses: actions/checkout@v4\n      - uses: actions/setup-python@v5\n        with:\n          python-version: '3.12'\n          cache: pip\n      - name: Install\n        run: python -m pip install --upgrade pip && python -m pip install -e '.[dev,server]'\n      - name: Ruff\n        run: python -m ruff check src tests\n      - name: Policy 27 regression tests\n        run: >-\n          python -m pytest -q\n          tests/unit/test_hifi_semantic_pairing.py\n          tests/unit/test_hifi_semantic_reskin.py\n          tests/unit/test_hifi_policy27_compatibility.py\n          tests/unit/test_hifi_policy27_runtime_contract.py\n          tests/unit/test_hifi_target_state_reskin.py\n          tests/unit/test_hifi_review_policy27.py\n          tests/unit/test_hifi_replacement_store.py\n      - name: Full unit suite\n        run: python -m pytest -q tests/unit\n      - name: Policy 27 strict typing\n        run: >-\n          python -m mypy --follow-imports=skip\n          src/figma_to_fgui/hifi_semantic_pairing.py\n          src/figma_to_fgui/hifi_semantic_reskin.py\n          src/figma_to_fgui/hifi_review.py\n          src/figma_to_fgui/hifi_replacement_store.py\n      - name: Legacy type-debt ceiling\n        shell: bash\n        run: |\n          set +e\n          python -m mypy src 2>&1 | tee /tmp/mypy-full.log\n          errors=$(grep -c ': error:' /tmp/mypy-full.log || true)\n          echo "Legacy full-project mypy errors: $errors"\n          if [ "$errors" -gt 86 ]; then\n            echo "Type debt increased above the audited baseline of 86 errors."\n            exit 1\n          fi\n          if [ "$errors" -gt 0 ]; then\n            echo "::warning::Legacy mypy debt remains: $errors errors (ceiling 86). Policy 27 modules are checked separately and must be clean."\n          fi\n          exit 0\n''', 'utf-8')

          policy = Path('POLICY27.md')
          text = policy.read_text('utf-8')
          if '## Type-safety gate' not in text:
              text += '''\n## Type-safety gate\n\nPolicy 27 modules must pass strict mypy independently. The pre-existing repository still has an audited legacy mypy debt ceiling; CI fails if that debt increases. This ceiling is not an approval waiver for runtime/editor verification and should be reduced over time.\n'''
          policy.write_text(text, 'utf-8')
          PY
          python -m pip install 'ruff==0.16.10'
          python -m ruff check --fix \
            src/figma_to_fgui/hifi_semantic_pairing.py \
            src/figma_to_fgui/hifi_semantic_reskin.py
          rm .github/workflows/policy27-typefix.yml
      - name: Commit normalization
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Normalize Policy 27 type gates and legacy debt ceiling'
          git push origin HEAD:fix/policy27-semantic-reskin
