name: Policy 27 source typing fix

on:
  push:
    branches:
      - fix/policy27-semantic-reskin

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/policy27-semantic-reskin
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fix Policy 27 source typing
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          for name, function in (
              ('src/figma_to_fgui/hifi_semantic_pairing.py', 'def _parents'),
              ('src/figma_to_fgui/hifi_semantic_reskin.py', 'def _parent_ids'),
          ):
              path = Path(name)
              text = path.read_text('utf-8')
              start = text.find(function)
              if start < 0:
                  raise SystemExit(f'{function} missing in {name}')
              tail = text[start:]
              old = '    pending = [(root, None) for root in manifest.top_level_nodes]\n'
              new = ('    pending: list[tuple[SelectionNode, str | None]] = [\n'
                     '        (root, None) for root in manifest.top_level_nodes\n'
                     '    ]\n')
              if old not in tail:
                  raise SystemExit(f'pending marker missing in {function}')
              path.write_text(text[:start] + tail.replace(old, new, 1), 'utf-8')
          PY
          python -m pip install 'ruff==0.16.10'
          python -m ruff check --fix \
            src/figma_to_fgui/hifi_semantic_pairing.py \
            src/figma_to_fgui/hifi_semantic_reskin.py
      - name: Commit source fixes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/figma_to_fgui/hifi_semantic_pairing.py src/figma_to_fgui/hifi_semantic_reskin.py
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Fix Policy 27 source typing annotations'
          git push origin HEAD:fix/policy27-semantic-reskin
