name: Policy 27 one-shot consistency fix

on:
  push:
    branches:
      - fix/policy27-semantic-reskin

permissions:
  contents: write

jobs:
  autofix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/policy27-semantic-reskin
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply deterministic consistency fixes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/figma_to_fgui/hifi_mapping.py')
          text = path.read_text('utf-8')
          old = '''                def spare_score(node: SelectionNode) -> tuple[float, int]:\n                    box = _selection_box(manifest, node, inventory)\n                    node_area = max(1.0, box[2] * box[3])\n                    size_similarity = min(old_area, node_area) / max(old_area, node_area)\n                    return size_similarity, -int(node.properties.get("psdDocumentIndex", 0))\n'''
          new = '''                def spare_score(\n                    node: SelectionNode, owner_area: float = old_area\n                ) -> tuple[float, int]:\n                    box = _selection_box(manifest, node, inventory)\n                    node_area = max(1.0, box[2] * box[3])\n                    size_similarity = min(owner_area, node_area) / max(owner_area, node_area)\n                    return size_similarity, -int(node.properties.get("psdDocumentIndex", 0))\n'''
          if old not in text:
              raise SystemExit('expected hifi_mapping closure block not found')
          path.write_text(text.replace(old, new, 1), 'utf-8')

          path = Path('src/figma_to_fgui/hifi_semantic_reskin.py')
          text = path.read_text('utf-8')
          old = '''    parent = old_by_id.get(old.parent_id or "")\n    if parent is not None and parent.auto_layout is not None and parent.layout_excludes_invisible:\n        return False\n    return True\n'''
          new = '''    parent = old_by_id.get(old.parent_id or "")\n    return not (\n        parent is not None\n        and parent.auto_layout is not None\n        and parent.layout_excludes_invisible\n    )\n'''
          if old not in text:
              raise SystemExit('expected semantic retire block not found')
          path.write_text(text.replace(old, new, 1), 'utf-8')

          path = Path('src/figma_to_fgui/hifi_replacement_workflow.py')
          text = path.read_text('utf-8')
          text = text.replace(
              'Policy 26 may have\n            # already classified',
              'the current mapping policy may have\n            # already classified',
              1,
          )
          path.write_text(text, 'utf-8')
          PY
          python -m pip install 'ruff==0.16.10'
          python -m ruff check --fix \
            src/figma_to_fgui/hifi_mapping.py \
            src/figma_to_fgui/hifi_semantic_pairing.py \
            src/figma_to_fgui/hifi_semantic_reskin.py \
            src/figma_to_fgui/hifi_replacement_workflow.py \
            tests/unit/test_hifi_semantic_pairing.py \
            tests/unit/test_hifi_semantic_reskin.py \
            tests/unit/test_hifi_policy27_compatibility.py \
            tests/unit/test_hifi_target_state_reskin.py \
            tests/unit/test_hifi_review_policy27.py
          rm .github/workflows/policy27-autofix.yml
      - name: Commit one-shot fixes
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'Normalize Policy 27 audit lint and stale traces'
          git push origin HEAD:fix/policy27-semantic-reskin
